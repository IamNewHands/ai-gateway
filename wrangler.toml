name = "ai-gateway"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# Smart Placement：将 Worker 执行点自动调度到距离上游（如 Google Gemini）更近的 Cloudflare 节点，
# 使出口 IP 落在受支持地区（Gemini API 有地域限制，就近节点可能返回 FAILED_PRECONDITION）。
[placement]
mode = "smart"

# KV namespace — wrangler will auto-resolve by name
[[kv_namespaces]]
binding = "KV"

# M365 Copilot Session Durable Object — 承载 ChatHub WS 会话（绕过 Worker 墙钟限制，
# 同会话并发串行化 + 会话绑定读写）。
[durable_objects]
bindings = [
  { name = "M365_SESSION", class_name = "M365Session" },
  { name = "M365_FLUX", class_name = "AccountFlux" },
]

# M365Session 生命周期用声明式 exports（与 legacy [[migrations]] 互斥，只能二选一）。
# 相比 [[migrations]]，exports 由 Cloudflare 对账自动创建 namespace，不依赖 migration tag 链，
# 可规避给「已存在且从未部署过 DO 迁移」的 Worker 首次加 DO 时的
# "Actor migration tag precondition failed, got tag '' when expected tag is 'v1'" (10079) 报错。
[exports.M365Session]
type = "durable-object"
storage = "sqlite"

[exports.AccountFlux]
type = "durable-object"
storage = "sqlite"

# Analytics Engine 数据集 — 记录代理请求用量统计
[vars]
USAGE_ANALYTICS_DATASET = "ai_gateway_usage"

# M365：会话/上下文 TTL（小时，可选；缺省 2）
# M365_SESSION_TTL_HOURS = "2"
# M365_CONTEXT_TTL_HOURS = "2"

[[analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "ai_gateway_usage"

# 定时任务：OAuth token 刷新（每 2 小时）+ WorkBuddy 签到（每日 09:00/21:00 北京时间 = 01:00/13:00 UTC）+ M365 对话清理（每小时）
[triggers]
crons = ["0 */2 * * *", "0 1,13 * * *", "0 * * * *"]

# Admin credentials (set these in Cloudflare Dashboard > Workers > Variables)
# [vars]
# ADMIN_USERNAME = "admin"
# ADMIN_PASSWORD = "your-password"
# MANAGEMENT_TOKEN = "对外管理 API (/api/manage/*) 的 Bearer Token；不配置则该 API 返回 503"
# OPENCODE_MIRRORS_URL = "https://opencode.ai.cmliussss.net/zen/v1\nhttps://opencode.fastly.cmliussss.net/zen/v1\nhttps://opencode.gcore.cmliussss.net/zen/v1"
# Gemini CLI OAuth 客户端凭据（也可在管理后台表单中粘贴；与 cpa-plugin-gemini-cli 中的官方凭据一致）
# GEMINI_OAUTH_CLIENT_ID = ""
# GEMINI_OAUTH_CLIENT_SECRET = ""
